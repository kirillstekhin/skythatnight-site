<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Sky, That Night — TikTok authorisation</title>
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center;
         background:#0b1733; color:#eaf0ff;
         font:16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .card { text-align:center; padding:2rem; }
  h1 { font-family:Georgia, serif; font-weight:500; letter-spacing:.08em; font-size:1.4rem; }
  p { color:#8fb0e6; }
  code { font-size:.8rem; color:#c9a961; word-break:break-all; }
</style>
</head>
<body>
<!-- Колбэк TikTok OAuth. TikTok не пускает http://localhost в redirect URI (в отличие от
     Pinterest/Etsy), поэтому код приезжает сюда — на наш домен. Страница ничего никуда
     не шлёт: код остаётся в адресной строке, его забирает инструмент из открытой вкладки. -->
<div class="card">
  <h1>SKY, THAT NIGHT</h1>
  <p id="msg">Authorisation received — you can close this tab.</p>
  <p><code id="q"></code></p>
</div>
<script>
  var q = new URLSearchParams(location.search);
  document.getElementById("q").textContent =
    q.get("code") ? "code received" : (location.search || "no parameters");
  if (q.get("error")) document.getElementById("msg").textContent =
    "Authorisation failed: " + q.get("error");
</script>
</body>
</html>
